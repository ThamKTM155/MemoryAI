<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Talking AI Kids</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
  margin:0;
  font-family:Arial;
  background:#cceeff;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.app{
  background:white;
  width:360px;
  padding:20px;
  border-radius:20px;
  text-align:center;
}
#avatar{ font-size:70px; }
#bubble{
  background:#eef;
  padding:15px;
  border-radius:15px;
  margin:15px 0;
  min-height:60px;
}
button{
  width:200px;
  padding:10px;
  margin:6px;
  border-radius:20px;
  font-size:16px;
}
</style>
</head>

<body>
<div class="app">
  <div id="avatar">🤖</div>
  <div id="bubble">Bé ơi, bấm nút để bắt đầu nhé 🌙</div>

<button id="btnTalk">🎤 BÉ NÓI</button>
<button id="btnStop">⏹ DỪNG NÓI</button>

  <button id="btnStory">📖 KỂ CHUYỆN NGỦ</button>
  <button id="btnMusic">🎵 NHẠC RU</button>

  <audio id="bgm" loop>
  <source src="audio/kids-music.mp3" type="audio/mpeg">
</audio>

<audio id="ting" src="audio/ting.mp3"></audio>
<audio id="bgm" src="audio/kids-music.mp3" loop preload="auto"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
